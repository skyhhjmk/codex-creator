services:
  db:
    image: ${CODEX_CREATOR_POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codex_creator}
      POSTGRES_USER: ${POSTGRES_USER:-codex_creator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - codex-creator-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - codex-creator-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  codex-creator:
    build:
      context: .
      args:
        CODEX_RELEASE: ${CODEX_RELEASE:-0.150.1}
    image: ${CODEX_CREATOR_IMAGE:-ghcr.io/skyhhjmk/codex-creator:latest}
    restart: unless-stopped
    environment:
      CODEX_CREATOR_DB_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-codex_creator}
      CODEX_CREATOR_DB_USERNAME: ${POSTGRES_USER:-codex_creator}
      CODEX_CREATOR_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      CODEX_CREATOR_REDIS_URL: redis://redis:6379
      CODEX_CREATOR_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      CODEX_CREATOR_ADMIN_TOKEN: ${CODEX_CREATOR_ADMIN_TOKEN:?CODEX_CREATOR_ADMIN_TOKEN must be set}
      CODEX_CREATOR_INTERNAL_SHARED_SECRET: ${CODEX_CREATOR_INTERNAL_SHARED_SECRET:?CODEX_CREATOR_INTERNAL_SHARED_SECRET must be set}
      CODEX_CREATOR_MCP_BEARER_TOKEN: ${CODEX_CREATOR_MCP_BEARER_TOKEN:?CODEX_CREATOR_MCP_BEARER_TOKEN must be set}
      CODEX_APP_SERVER_ENABLED: ${CODEX_APP_SERVER_ENABLED:-false}
      CODEX_COMMAND: ${CODEX_COMMAND:-codex}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
    volumes:
      - codex-creator-data:/data/codex-creator
      - ${CODEX_CREATOR_LOG_DIR:-./logs}:/deployments/logs
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8681/q/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

networks:
  internal:

volumes:
  codex-creator-postgres:
  codex-creator-redis:
  codex-creator-data:
