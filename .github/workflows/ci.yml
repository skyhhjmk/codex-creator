name: Codex Creator native image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/skyhhjmk/codex-creator

jobs:
  build-native-image:
    name: Build and publish native image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x ./mvnw

      - name: Verify JVM tests
        run: ./mvnw -B -ntp verify

      - name: Calculate version and publish policy
        id: release
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          VERSION="0.1.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          PUSH_IMAGE="false"
          ADD_LATEST="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              PUSH_IMAGE="true"
              ADD_LATEST="true"
            else
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "branch" &&
                  ( "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ) ]]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
            PUSH_IMAGE="true"
            ADD_LATEST="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            PUSH_IMAGE="false"
            ADD_LATEST="false"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "push_image=${PUSH_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "add_latest=${ADD_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Set Maven project version
        run: |
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${{ steps.release.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build native application
        shell: bash
        run: |
          ./mvnw -B -ntp clean package \
            -DskipTests \
            -Dnative \
            -Dquarkus.application.version="${{ steps.release.outputs.version }}" \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.native-image-xmx=8g \
            -Dquarkus.container-image.build=false \
            -Dquarkus.container-image.push=false

      - name: Verify native executable
        shell: bash
        run: |
          RUNNER="$(find target -maxdepth 1 -type f -name '*-runner' -print -quit)"
          if [[ -z "${RUNNER}" || ! -x "${RUNNER}" ]]; then
            echo "Quarkus native runner was not produced." >&2
            exit 1
          fi
          file "${RUNNER}"
          file "${RUNNER}" | grep -Eq 'ELF .*executable|Mach-O' || {
            echo "The produced runner is not a native executable." >&2
            exit 1
          }

      - name: Login to GHCR
        if: steps.release.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag native image
        shell: bash
        run: |
          IMAGE="${{ steps.release.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"
          SHORT_SHA="${{ steps.release.outputs.short_sha }}"

          docker build \
            -f src/main/docker/Dockerfile.native \
            -t "${IMAGE}:${VERSION}-native" \
            -t "${IMAGE}:sha-${SHORT_SHA}-native" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:sha-${SHORT_SHA}" \
            .

          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            docker tag "${IMAGE}:${VERSION}-native" "${IMAGE}:latest-native"
            # Keep the old deployment default working while consumers migrate
            # to the explicit latest-native tag.
            docker tag "${IMAGE}:${VERSION}-native" "${IMAGE}:latest"
          fi

      - name: Push native images to GHCR
        if: steps.release.outputs.push_image == 'true'
        shell: bash
        run: |
          IMAGE="${{ steps.release.outputs.image }}"
          VERSION="${{ steps.release.outputs.version }}"
          SHORT_SHA="${{ steps.release.outputs.short_sha }}"

          docker push "${IMAGE}:${VERSION}-native"
          docker push "${IMAGE}:sha-${SHORT_SHA}-native"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:sha-${SHORT_SHA}"

          if [[ "${{ steps.release.outputs.add_latest }}" == "true" ]]; then
            docker push "${IMAGE}:latest-native"
            docker push "${IMAGE}:latest"
          fi
