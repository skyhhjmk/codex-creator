quarkus.application.name=codex-creator
%dev.quarkus.devservices.enabled=false
quarkus.http.port=${CODEX_CREATOR_HTTP_PORT:8681}
quarkus.http.host=${CODEX_CREATOR_HTTP_HOST:0.0.0.0}
quarkus.http.limits.max-body-size=${CODEX_CREATOR_MAX_BODY_SIZE:16M}

# Private by default. Publish OpenAPI only through an explicitly controlled internal route.
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${CODEX_CREATOR_DB_JDBC_URL:jdbc:postgresql://${CODEX_CREATOR_DB_HOST:${DB_HOST:localhost}}:${CODEX_CREATOR_DB_PORT:${DB_PORT:5432}}/${CODEX_CREATOR_DB_NAME:${DB_NAME:${POSTGRES_DB:codex_creator}}}}
quarkus.datasource.username=${CODEX_CREATOR_DB_USERNAME:${DB_USERNAME:${POSTGRES_USER:postgres}}}
quarkus.datasource.password=${CODEX_CREATOR_DB_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:}}}
quarkus.hibernate-orm.database.generation=none
quarkus.liquibase.migrate-at-start=${CODEX_CREATOR_LIQUIBASE_MIGRATE_AT_START:true}
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

quarkus.redis.hosts=${CODEX_CREATOR_REDIS_URL:${REDIS_URL:redis://localhost:6379}}
quarkus.redis.password=${CODEX_CREATOR_REDIS_PASSWORD:${REDIS_PASSWORD:}}

codex.creator.admin-token=${CODEX_CREATOR_ADMIN_TOKEN:}
codex.creator.internal-shared-secret=${CODEX_CREATOR_INTERNAL_SHARED_SECRET:}
codex.creator.mcp-bearer-token=${CODEX_CREATOR_MCP_BEARER_TOKEN:}
codex.creator.internal.clock-skew-seconds=${CODEX_CREATOR_INTERNAL_CLOCK_SKEW_SECONDS:300}
codex.creator.mcp.write-approval-required=${CODEX_CREATOR_MCP_WRITE_APPROVAL_REQUIRED:false}
codex.creator.test-server.encryption-secret=${CODEX_CREATOR_TEST_SERVER_ENCRYPTION_SECRET:}
codex.creator.windblog.endpoint=${CODEX_CREATOR_WINDBLOG_ENDPOINT:http://windblog:8080}
codex.creator.windblog.shared-secret=${CODEX_CREATOR_WINDBLOG_SHARED_SECRET:${CODEX_CREATOR_INTERNAL_SHARED_SECRET:}}
codex.creator.windblog.timeout=${CODEX_CREATOR_WINDBLOG_TIMEOUT:30S}
codex.creator.windblog.max-image-bytes=${CODEX_CREATOR_WINDBLOG_MAX_IMAGE_BYTES:8388608}

codex.app-server.enabled=${CODEX_APP_SERVER_ENABLED:false}
codex.app-server.command=${CODEX_COMMAND:codex}
codex.app-server.working-directory=${CODEX_WORKING_DIRECTORY:.}
codex.app-server.request-timeout=${CODEX_APP_SERVER_REQUEST_TIMEOUT:120S}
codex.app-server.turn-completion-timeout=${CODEX_APP_SERVER_TURN_COMPLETION_TIMEOUT:10M}
codex.app-server.restart-backoff=${CODEX_APP_SERVER_RESTART_BACKOFF:2S}
codex.app-server.experimental-api=${CODEX_APP_SERVER_EXPERIMENTAL_API:false}
codex.app-server.schema-version=${CODEX_APP_SERVER_SCHEMA_VERSION:unlocked}
codex.app-server.windblog-mcp-enabled=${CODEX_APP_SERVER_WINDBLOG_MCP_ENABLED:true}
codex.app-server.windblog-mcp-url=${CODEX_APP_SERVER_WINDBLOG_MCP_URL:http://127.0.0.1:8681/mcp}
codex.app-server.windblog-mcp-bearer-token-env-var=${CODEX_APP_SERVER_WINDBLOG_MCP_BEARER_TOKEN_ENV_VAR:CODEX_CREATOR_MCP_BEARER_TOKEN}
codex.app-server.windblog-mcp-tools-approval-mode=${CODEX_APP_SERVER_WINDBLOG_MCP_TOOLS_APPROVAL_MODE:auto}

codex.creator.default-profile-id=${CODEX_CREATOR_DEFAULT_PROFILE_ID:codex-default}
codex.creator.prompt-version=${CODEX_CREATOR_PROMPT_VERSION:2}
codex.creator.article.reasoning-effort=${CODEX_CREATOR_ARTICLE_REASONING_EFFORT:high}
codex.creator.topic.reasoning-effort=${CODEX_CREATOR_TOPIC_REASONING_EFFORT:medium}
codex.creator.article.max-quality-attempts=${CODEX_CREATOR_ARTICLE_MAX_QUALITY_ATTEMPTS:2}
codex.creator.article.min-cjk-characters=${CODEX_CREATOR_ARTICLE_MIN_CJK_CHARACTERS:1200}
codex.creator.article.min-words=${CODEX_CREATOR_ARTICLE_MIN_WORDS:900}
codex.creator.article.min-sources=${CODEX_CREATOR_ARTICLE_MIN_SOURCES:2}
codex.creator.article.require-generated-images=${CODEX_CREATOR_ARTICLE_REQUIRE_GENERATED_IMAGES:false}
codex.creator.wikimedia.enabled=${CODEX_CREATOR_WIKIMEDIA_ENABLED:true}
codex.creator.task.max-attempts=${CODEX_CREATOR_TASK_MAX_ATTEMPTS:3}
codex.creator.task.retry-delay-millis=${CODEX_CREATOR_TASK_RETRY_DELAY_MILLIS:1000}
codex.creator.task.lock-ttl-seconds=${CODEX_CREATOR_TASK_LOCK_TTL_SECONDS:300}
codex.creator.task.lock-wait-seconds=${CODEX_CREATOR_TASK_LOCK_WAIT_SECONDS:35}
codex.creator.task.usage-limit-fallback-delay=${CODEX_CREATOR_USAGE_LIMIT_FALLBACK_DELAY:30m}
codex.creator.task.usage-limit-retry-zone=${CODEX_CREATOR_USAGE_LIMIT_RETRY_ZONE:Asia/Shanghai}

quarkus.container-image.registry=${CONTAINER_IMAGE_REGISTRY:ghcr.io}
quarkus.container-image.group=${CONTAINER_IMAGE_GROUP:skyhhjmk}
quarkus.container-image.name=${CONTAINER_IMAGE_NAME:codex-creator}
