quarkus.application.name=codex-creator
quarkus.http.port=${CODEX_CREATOR_HTTP_PORT:8681}
quarkus.http.host=${CODEX_CREATOR_HTTP_HOST:0.0.0.0}
quarkus.http.limits.max-body-size=2M

# Private by default. Publish OpenAPI only through an explicitly controlled internal route.
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${CODEX_CREATOR_DB_JDBC_URL:jdbc:postgresql://${CODEX_CREATOR_DB_HOST:localhost}:${CODEX_CREATOR_DB_PORT:5432}/${CODEX_CREATOR_DB_NAME:codex_creator}}
quarkus.datasource.username=${CODEX_CREATOR_DB_USERNAME:codex_creator}
quarkus.datasource.password=${CODEX_CREATOR_DB_PASSWORD:}
quarkus.hibernate-orm.database.generation=none
quarkus.liquibase.migrate-at-start=${CODEX_CREATOR_LIQUIBASE_MIGRATE_AT_START:true}
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

quarkus.redis.hosts=${CODEX_CREATOR_REDIS_URL:redis://localhost:6379}
quarkus.redis.password=${CODEX_CREATOR_REDIS_PASSWORD:}

codex.creator.admin-token=${CODEX_CREATOR_ADMIN_TOKEN:}
codex.creator.internal-shared-secret=${CODEX_CREATOR_INTERNAL_SHARED_SECRET:}
codex.creator.mcp-bearer-token=${CODEX_CREATOR_MCP_BEARER_TOKEN:}
codex.creator.internal.clock-skew-seconds=${CODEX_CREATOR_INTERNAL_CLOCK_SKEW_SECONDS:300}
codex.creator.mcp.write-approval-required=${CODEX_CREATOR_MCP_WRITE_APPROVAL_REQUIRED:true}

codex.app-server.enabled=${CODEX_APP_SERVER_ENABLED:false}
codex.app-server.command=${CODEX_COMMAND:codex}
codex.app-server.working-directory=${CODEX_WORKING_DIRECTORY:.}
codex.app-server.request-timeout=${CODEX_APP_SERVER_REQUEST_TIMEOUT:120S}
codex.app-server.restart-backoff=${CODEX_APP_SERVER_RESTART_BACKOFF:2S}
codex.app-server.experimental-api=${CODEX_APP_SERVER_EXPERIMENTAL_API:false}
codex.app-server.schema-version=${CODEX_APP_SERVER_SCHEMA_VERSION:unlocked}

codex.creator.default-profile-id=${CODEX_CREATOR_DEFAULT_PROFILE_ID:codex-default}
codex.creator.prompt-version=${CODEX_CREATOR_PROMPT_VERSION:1}
codex.creator.task.max-attempts=${CODEX_CREATOR_TASK_MAX_ATTEMPTS:3}
codex.creator.task.retry-delay-millis=${CODEX_CREATOR_TASK_RETRY_DELAY_MILLIS:1000}
codex.creator.task.lock-ttl-seconds=${CODEX_CREATOR_TASK_LOCK_TTL_SECONDS:300}
codex.creator.task.lock-wait-seconds=${CODEX_CREATOR_TASK_LOCK_WAIT_SECONDS:35}

quarkus.container-image.registry=${CONTAINER_IMAGE_REGISTRY:ghcr.io}
quarkus.container-image.group=${CONTAINER_IMAGE_GROUP:skyhhjmk}
quarkus.container-image.name=${CONTAINER_IMAGE_NAME:codex-creator}
